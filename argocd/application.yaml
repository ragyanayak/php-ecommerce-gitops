apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:

  name: php-ecommerce-dev

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/ragyanayak/php-ecommerce-gitops.git

    targetRevision: main

    path: dev

  destination:

    server: https://kubernetes.default.svc

    namespace: ecommerce

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true
