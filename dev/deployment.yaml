apiVersion: apps/v1

kind: Deployment

metadata:
  name: php-ecommerce

  namespace: ecommerce

spec:

  replicas: 2

  selector:

    matchLabels:
      app: php-ecommerce

  template:

    metadata:

      labels:
        app: php-ecommerce

    spec:

      containers:

        - name: php-ecommerce

          image: ragyanayak/php-ecommerce:9

          imagePullPolicy: Always

          ports:

            - containerPort: 80
              name: http

          resources:

            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:

            httpGet:
              path: /
              port: http

            initialDelaySeconds: 5

            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /
              port: http

            initialDelaySeconds: 15

            periodSeconds: 20
